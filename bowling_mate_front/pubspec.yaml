name: bowling_mate_front
description: "Bowling Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  #network
  dio: ^5.4.0
  #Local Storage Core
  shared_preferences: ^2.3.2

  #Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.4

  #UI/ Animation / State Management
  provider: ^6.1.1           # 상태 관리
  #flutter_bloc: ^9.0.0       # 상태 관리 (선택적)
  equatable: ^2.0.5          # Bloc 등에서 객체 비교용
  google_fonts: ^6.2.1       # 커스텀 폰트
  fluttertoast: ^8.2.5       # 간단한 알림 메시지
  intl: ^0.19.0              # 날짜/시간 포맷팅
  cupertino_icons: ^1.0.8

  video_compress: ^3.1.3
  video_player: ^2.9.1      #영상 재생
  image_picker: ^1.1.1      #영상 선택
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

